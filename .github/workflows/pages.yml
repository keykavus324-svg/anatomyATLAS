name: GitHub Pages

on:
  push:
    branches:
      - arena/d9b32dd7-anatomyatlas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıklar
        run: npm ci
      - name: GitHub Pages yapılandırması
        uses: actions/configure-pages@v5
      - name: Üretim derlemesi
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Testler
        run: npm test
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
